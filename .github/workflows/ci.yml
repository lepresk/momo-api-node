name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        # Pinned deliberately: `latest` once drifted onto a pnpm major the
        # matrix could not run, breaking CI with no change to the lockfile.
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Verify the packed tarball installs and imports
        run: pnpm verify:pack
